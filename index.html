<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From INI ARCHIVE | フロイニ放送回データベース</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            midnight: {
              950: '#07090e',
              900: '#0d111a',
              800: '#151c2c',
              700: '#1f2940',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
    .glass-panel {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-midnight-950 dark:text-slate-100 min-h-screen transition-colors duration-200 selection:bg-indigo-500 selection:text-white flex flex-col">

  <!-- トースト通知 -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/85 dark:bg-midnight-900/85 glass-panel">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-2">
      <!-- ロゴ・タイトル -->
      <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 shrink-0">
          <i class="fa-solid fa-radio text-base sm:text-lg"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-500 to-violet-500 dark:from-indigo-400 dark:to-fuchsia-400 bg-clip-text text-transparent truncate">
              From INI ARCHIVE
            </h1>
            <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20 shrink-0">
              FRI 25:00 - 27:00
            </span>
          </div>
          <!-- データ同期ステータス表示 -->
          <div id="sync-status" class="flex items-center gap-1.5 text-[11px] text-slate-500 dark:text-slate-400 truncate">
            <i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i>
            <span>最新データを読み込み中...</span>
          </div>
        </div>
      </div>

      <!-- 右側アクションボタン（最新データ再読込・テーマ切替） -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button onclick="fetchSpreadsheetData(true)" id="reload-btn" title="スプレッドシートから最新データを再取得" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-midnight-800 dark:hover:bg-midnight-700 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700/80 transition active:scale-95 cursor-pointer">
          <i id="reload-icon" class="fa-solid fa-arrows-rotate text-indigo-500"></i>
          <span class="hidden sm:inline">最新データ再読込</span>
        </button>
        <button onclick="toggleTheme()" title="ライト/ダークモード切替" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 hover:bg-slate-200 dark:bg-midnight-800 dark:hover:bg-midnight-700 text-slate-700 dark:text-amber-300 border border-slate-200/80 dark:border-slate-700/80 transition cursor-pointer">
          <i class="fa-solid fa-sun dark:hidden"></i>
          <i class="fa-solid fa-moon hidden dark:inline"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 sm:py-6 space-y-4 sm:space-y-5">

    <!-- 検索＆フィルターパネル -->
    <section class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-midnight-900 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
      
      <!-- 1段目：メンバー選択フィルター -->
      <div>
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-users mr-1 text-indigo-500"></i>メンバーで絞り込み
          </span>

          <!-- AND / OR 切替 & クリア -->
          <div class="flex items-center gap-1.5 sm:gap-2">
            <div class="inline-flex rounded-xl p-0.5 bg-slate-100 dark:bg-midnight-800 border border-slate-200 dark:border-slate-700 text-[11px] sm:text-xs">
              <button id="mode-and-btn" onclick="setFilterMode('AND')" class="px-2.5 py-1 rounded-lg font-bold transition cursor-pointer bg-indigo-600 text-white shadow-sm">
                AND（全員一緒）
              </button>
              <button id="mode-or-btn" onclick="setFilterMode('OR')" class="px-2.5 py-1 rounded-lg font-bold transition cursor-pointer text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                OR（誰か出演）
              </button>
            </div>
            <button onclick="clearMemberFilter()" id="clear-member-btn" class="hidden px-2.5 py-1.5 rounded-xl text-xs font-semibold text-rose-500 hover:bg-rose-500/10 transition cursor-pointer">
              <i class="fa-solid fa-xmark mr-0.5"></i>選択解除
            </button>
          </div>
        </div>

        <!-- 11人メンバーバッジ -->
        <div id="member-filter-chips" class="flex flex-wrap gap-1.5 sm:gap-2">
          <!-- JSで自動生成 -->
        </div>
      </div>

      <hr class="border-slate-200/70 dark:border-slate-800">

      <!-- 2段目：フリーワード検索・コーナー選択・お気に入りのみ -->
      <div class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2.5">
          <!-- フリーワード検索 -->
          <div class="relative lg:col-span-5">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="search-input" oninput="applyFilters()" placeholder="放送回(255_2)、ゲスト名、テーマ、曲名、メモ..." class="w-full pl-9 pr-8 py-2.5 rounded-xl text-sm bg-slate-100/80 dark:bg-midnight-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <button id="clear-search-btn" onclick="clearSearchInput()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer p-1">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
          </div>

          <!-- コーナー絞り込みプルダウン -->
          <div class="relative lg:col-span-4">
            <i class="fa-solid fa-bookmark absolute left-3.5 top-1/2 -translate-y-1/2 text-indigo-400 text-xs pointer-events-none"></i>
            <select id="corner-select" onchange="applyFilters()" class="w-full pl-9 pr-8 py-2.5 rounded-xl text-sm bg-slate-100/80 dark:bg-midnight-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none cursor-pointer transition text-slate-700 dark:text-slate-200">
              <option value="ALL">コーナーで絞り込む（すべて）</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
          </div>

          <!-- お気に入りのみトグルボタン -->
          <div class="lg:col-span-3">
            <button id="fav-only-btn" onclick="toggleFavoriteOnly()" class="w-full h-full min-h-[42px] px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 border transition active:scale-95 cursor-pointer bg-amber-500/10 text-amber-600 dark:text-amber-300 border-amber-500/30 hover:bg-amber-500/20">
              <i id="fav-only-icon" class="fa-regular fa-star text-amber-400"></i>
              <span>お気に入りのみ</span>
              <span id="fav-count-badge" class="px-1.5 py-0.5 rounded-md text-[11px] bg-amber-500/20 text-amber-700 dark:text-amber-200">0</span>
            </button>
          </div>
        </div>

        <!-- 3段目：クイック形式フィルター＆ヒット件数・ソート -->
        <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
          <!-- 形式フィルター -->
          <div class="flex flex-wrap items-center gap-1.5" id="type-filters">
            <button data-type="ALL" onclick="setTypeFilter('ALL')" class="type-btn px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer bg-indigo-600 text-white shadow-sm">
              すべて
            </button>
            <button data-type="PART_1" onclick="setTypeFilter('PART_1')" class="type-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-midnight-800 dark:text-slate-300 dark:hover:bg-midnight-700">
              1時台 (_1)
            </button>
            <button data-type="PART_2" onclick="setTypeFilter('PART_2')" class="type-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-midnight-800 dark:text-slate-300 dark:hover:bg-midnight-700">
              2時台 (_2)
            </button>
            <button data-type="3人" onclick="setTypeFilter('3人')" class="type-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-midnight-800 dark:text-slate-300 dark:hover:bg-midnight-700">
              3人回
            </button>
            <button data-type="2人" onclick="setTypeFilter('2人')" class="type-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-midnight-800 dark:text-slate-300 dark:hover:bg-midnight-700">
              2人回
            </button>
            <button data-type="ゲスト" onclick="setTypeFilter('ゲスト')" class="type-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-midnight-800 dark:text-slate-300 dark:hover:bg-midnight-700">
              ゲスト回
            </button>
          </div>

          <!-- 右側：ヒット数・リセット・ソート -->
          <div class="flex items-center gap-2 ml-auto">
            <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">
              該当：<strong id="result-count-label" class="text-indigo-600 dark:text-indigo-400 font-extrabold">0</strong>件
            </span>

            <button onclick="resetFilters()" id="reset-all-btn" class="hidden px-2.5 py-1.5 rounded-xl text-xs font-semibold text-rose-500 bg-rose-500/10 hover:bg-rose-500/20 transition cursor-pointer">
              <i class="fa-solid fa-rotate-left mr-1"></i>全解除
            </button>

            <button onclick="toggleSortOrder()" id="sort-btn" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-midnight-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-200/70 dark:hover:bg-midnight-700 transition cursor-pointer">
              <i class="fa-solid fa-arrow-down-wide-short text-indigo-500" id="sort-icon"></i>
              <span id="sort-label">新しい順</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ローディングスケルトン -->
    <section id="loading-skeleton" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4">
      <div class="h-44 rounded-2xl bg-white dark:bg-midnight-900 border border-slate-200/80 dark:border-slate-800 p-4 animate-pulse space-y-3">
        <div class="h-5 w-1/3 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        <div class="h-3 w-1/2 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        <div class="flex gap-2 pt-2">
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        </div>
      </div>
      <div class="h-44 rounded-2xl bg-white dark:bg-midnight-900 border border-slate-200/80 dark:border-slate-800 p-4 animate-pulse space-y-3 hidden md:block">
        <div class="h-5 w-1/3 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        <div class="h-3 w-1/2 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        <div class="flex gap-2 pt-2">
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        </div>
      </div>
      <div class="h-44 rounded-2xl bg-white dark:bg-midnight-900 border border-slate-200/80 dark:border-slate-800 p-4 animate-pulse space-y-3 hidden lg:block">
        <div class="h-5 w-1/3 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        <div class="h-3 w-1/2 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        <div class="flex gap-2 pt-2">
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
          <div class="h-7 w-20 bg-slate-200 dark:bg-midnight-800 rounded-lg"></div>
        </div>
      </div>
    </section>

    <!-- 検索結果カード一覧 -->
    <section id="results-section" class="hidden">
      <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4">
        <!-- JSで描画 -->
      </div>

      <!-- もっと見るボタン（大量件数時の快適表示用） -->
      <div id="load-more-wrapper" class="hidden pt-6 pb-2 text-center">
        <button onclick="showMoreItems()" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl text-xs sm:text-sm font-bold bg-white dark:bg-midnight-900 hover:bg-slate-100 dark:hover:bg-midnight-800 text-indigo-600 dark:text-indigo-400 border border-slate-200 dark:border-slate-700 shadow-sm transition active:scale-95 cursor-pointer">
          <i class="fa-solid fa-angles-down"></i>
          <span id="load-more-label">さらに表示する</span>
        </button>
      </div>

      <!-- 0件時のエンプティステート -->
      <div id="empty-state" class="hidden py-14 px-4 text-center rounded-2xl bg-white dark:bg-midnight-900 border border-slate-200/80 dark:border-slate-800">
        <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-slate-100 dark:bg-midnight-800 flex items-center justify-center text-slate-400 text-xl">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <h3 class="text-base font-bold">条件に一致する放送回が見つかりませんでした</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">AND検索をOR検索に切り替えるか、フィルターを解除してみてください。</p>
        <button onclick="resetFilters()" class="mt-4 px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition cursor-pointer">
          フィルターをすべて解除
        </button>
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-200/70 dark:border-slate-800/70 py-5 px-4 text-center text-[11px] text-slate-400 dark:text-slate-500">
    <p>From INI Unofficial Archive Database — お気に入り（★）はこの端末のブラウザに保存されます。</p>
  </footer>

    // ==========================================
    // Googleスプレッドシート CSV 自動取得＆パース
    // ==========================================
    async function fetchSpreadsheetData(isManual = false) {
      const reloadIcon = document.getElementById('reload-icon');
      const syncStatus = document.getElementById('sync-status');

      reloadIcon.classList.add('fa-spin');
      syncStatus.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i><span>スプレッドシートを取得中...</span>`;

      try {
        // キャッシュバスター付きで最新のCSVを取得
        const fetchUrl = `${SHEET_CSV_URL}&t=${Date.now()}`;
        const response = await fetch(fetchUrl, { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const csvText = await response.text();
        const parsed = parseSpreadsheetCSV(csvText);

        if (parsed.length === 0) {
          throw new Error('有効なデータ行が見つかりませんでした');
        }

        episodes = parsed;

        // キャッシュに保存
        const nowStr = formatNowTimestamp();
        try {
          localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(episodes));
          localStorage.setItem(CACHE_TIME_KEY, nowStr);
        } catch (storageErr) {
          console.warn('Cache save skipped:', storageErr);
        }

        syncStatus.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i><span>同期済み（${nowStr} / 全${episodes.length}件）</span>`;

        if (isManual) {
          showToast(`最新データを読み込みました（全${episodes.length}件）`, 'success');
        }
      } catch (err) {
        console.error('CSV Fetch Error:', err);
        // キャッシュから復元を試みる
        const cachedRaw = localStorage.getItem(CACHE_DATA_KEY);
        const cachedTime = localStorage.getItem(CACHE_TIME_KEY);

        if (cachedRaw) {
          try {
            episodes = JSON.parse(cachedRaw);
            syncStatus.innerHTML = `<i class="fa-solid fa-clock-rotate-left text-amber-500"></i><span>キャッシュ表示中（${cachedTime || '前回取得'}）</span>`;
            if (isManual) {
              showToast('通信エラーのため保存済みキャッシュを表示しています', 'error');
            }
          } catch (e) {
            episodes = FALLBACK_SAMPLE_DATA;
            syncStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i><span>オフライン表示</span>`;
          }
        } else {
          episodes = FALLBACK_SAMPLE_DATA;
          syncStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i><span>データ取得に失敗しました</span>`;
          if (isManual) {
            showToast('データの取得に失敗しました。通信環境を確認してください。', 'error');
          }
        }
      } finally {
        reloadIcon.classList.remove('fa-spin');
        document.getElementById('loading-skeleton').classList.add('hidden');
        document.getElementById('results-section').classList.remove('hidden');

        populateCornerDropdown();
        applyFilters(true);
      }
    }

    /**
     * RFC4180準拠の堅牢なCSVパーサー（セル内改行・カンマ・ダブルクォート対応）
     */
    function parseCSVRows(text) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' && nextChar === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (char === '\n' || char === '\r') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += char;
          }
        }
      }

      if (currentField !== '' || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      return rows;
    }

    /**
     * 10列構成（A:放送日 〜 J:メモ）に変換。上部の空白行や見出し行を自動スキップ
     */
    function parseSpreadsheetCSV(csvText) {
      const rawRows = parseCSVRows(csvText);
      const result = [];
      let headerPassed = false;

      for (let i = 0; i < rawRows.length; i++) {
        const cols = rawRows[i];
        if (!cols || cols.every(c => c === '')) continue;

        const col0 = cols[0] || '';
        const col1 = cols[1] || '';

        // 見出し行（「放送日」「放送回」）を検出したらそれ以降をデータとして扱う
        if (col0.includes('放送日') || col1.includes('放送回')) {
          headerPassed = true;
          continue;
        }

        // 見出し行より上のメモ・フィルタ行はスキップ
        if (!headerPassed && i < 5 && !col1.match(/^\d+/)) {
          continue;
        }

        const item = {
          date: col0,
          episode: col1,
          type: cols[2] || '',
          membersRaw: cols[3] || '',
          guest: cols[4] || '',
          corner: cols[5] || '',
          theme: cols[6] || '',
          tunes: cols[7] || '',
          url: cols[8] || '',
          memo: cols[9] || ''
        };

        // 放送回または放送日のどちらかが入っていれば有効行とする
        if (item.episode || item.date) {
          result.push(item);
        }
      }

      return result;
    }

    function formatNowTimestamp() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    // ==========================================
    // メンバー解析（表記ゆれ・重複排除・ゲスト対応）
    // ==========================================
    function parseRowMembers(membersRaw, guestCol = '') {
      const matchedMembers = [];
      const matchedIds = new Set();
      const extraGuests = [];

      if (guestCol && guestCol.trim()) {
        extraGuests.push(guestCol.trim());
      }

      if (!membersRaw || !membersRaw.trim()) {
        return { matchedMembers, extraGuests, isEmpty: matchedMembers.length === 0 && extraGuests.length === 0 };
      }

      const rawTokens = membersRaw
        .split(/[＆&／\/・,、]+/)
        .map(t => t.trim())
        .filter(Boolean);

      rawTokens.forEach(token => {
        const found =
          INI_MEMBERS.find(m => m.aliases.some(alias => token === alias)) ||
          INI_MEMBERS.find(m => m.aliases.some(alias => alias.length >= 2 && token.includes(alias)));

        if (found) {
          if (!matchedIds.has(found.id)) {
            matchedIds.add(found.id);
            matchedMembers.push(found);
          }
        } else {
          const cleaned = token.replace(/^ゲスト[:：]?\s*/, '').trim();
          const label = cleaned ? cleaned : 'ゲスト';
          if (!extraGuests.includes(label)) {
            extraGuests.push(label);
          }
        }
      });

      return {
        matchedMembers,
        extraGuests,
        isEmpty: matchedMembers.length === 0 && extraGuests.length === 0
      };
    }

    // ==========================================

    function populateCornerDropdown() {
      const select = document.getElementById('corner-select');

      const cornerSet = new Set();
      episodes.forEach(ep => {
        if (ep.corner && ep.corner.trim()) {
          cornerSet.add(ep.corner.trim());
        }
      });

      const corners = Array.from(cornerSet).sort((a, b) => a.localeCompare(b, 'ja'));
      select.innerHTML = `<option value="ALL">コーナーで絞り込む（すべて / ${corners.length}種）</option>` +
        corners.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

      if (prevValue && (prevValue === 'ALL' || cornerSet.has(prevValue))) {
        select.value = prevValue;
      } else {
        select.value = 'ALL';
      }
    }

    function clearSearchInput() {

    function resetFilters() {
      selectedMemberIds.clear();
      typeFilter = 'ALL';
      favoriteOnly = false;
      document.getElementById('search-input').value = '';
      document.getElementById('corner-select').value = 'ALL';
      renderMemberFilterChips();
      setTypeFilter('ALL');
      updateFavoriteUI();
      applyFilters(true);
    }

    function episodeSortKey(epStr) {
      if (!epStr) return 0;
      const parts = String(epStr).split('_');
      const mainNum = parseInt(parts[0], 10) || 0;
      const subNum = parseInt(parts[1], 10) || 0;
      return mainNum * 10 + subNum;
    }

    function applyFilters(resetPagination = true) {
      if (resetPagination) {
        visibleLimit = PAGE_SIZE;
      }

      const searchInput = document.getElementById('search-input');
      const query = searchInput.value.trim().toLowerCase();
      const selectedCorner = document.getElementById('corner-select').value;
      const clearBtn = document.getElementById('clear-search-btn');
      const resetAllBtn = document.getElementById('reset-all-btn');

      if (query) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      const hasAnyFilter = selectedMemberIds.size > 0 || query !== '' || selectedCorner !== 'ALL' || typeFilter !== 'ALL' || favoriteOnly;
      if (hasAnyFilter) {
        resetAllBtn.classList.remove('hidden');
      } else {
        resetAllBtn.classList.add('hidden');
      }

      const indexed = episodes.map((item, idx) => {
        const epKey = getEpisodeKey(item, idx);
        return {
          ...item,
          idx,
          epKey,
          isFav: favoriteIds.has(epKey),
          parsed: parseRowMembers(item.membersRaw, item.guest)
        };
      });

      const filtered = indexed.filter(item => {
        if (favoriteOnly && !item.isFav) return false;

        if (selectedMemberIds.size > 0) {
          const rowMemberIds = new Set(item.parsed.matchedMembers.map(m => m.id));
          if (filterMode === 'AND') {
            for (const reqId of selectedMemberIds) {
              if (!rowMemberIds.has(reqId)) return false;
            }
          } else {
            let anyMatch = false;
            for (const reqId of selectedMemberIds) {
              if (rowMemberIds.has(reqId)) {
                anyMatch = true;
                break;
              }
            }
            if (!anyMatch) return false;
          }
        }

        if (selectedCorner && selectedCorner !== 'ALL') {
          if ((item.corner || '').trim() !== selectedCorner) return false;
        }

        if (typeFilter !== 'ALL') {
          if (typeFilter === 'PART_1') {
            if (!String(item.episode || '').endsWith('_1')) return false;
          } else if (typeFilter === 'PART_2') {
            if (!String(item.episode || '').endsWith('_2')) return false;
          } else if (typeFilter === 'ゲスト') {
            const hasGuest = (item.type || '').includes('ゲスト') ||
              (item.guest && item.guest.trim() !== '') ||
              item.parsed.extraGuests.length > 0;
            if (!hasGuest) return false;
          } else {
            if (!String(item.type || '').includes(typeFilter)) return false;
          }
        }

        if (query) {
          const hay = `${item.date} ${item.episode} ${item.type} ${item.membersRaw} ${item.guest} ${item.corner} ${item.theme} ${item.tunes} ${item.memo}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }

        return true;
      });

      filtered.sort((a, b) => {
        const keyA = episodeSortKey(a.episode);
        const keyB = episodeSortKey(b.episode);
        if (keyA !== keyB) {
          return sortDesc ? keyB - keyA : keyA - keyB;
        }
        return sortDesc ? a.idx - b.idx : b.idx - a.idx;
      });

      filteredEpisodes = filtered;
      document.getElementById('result-count-label').textContent = filtered.length;
      renderCards();
    }

    function showMoreItems() {
      visibleLimit += PAGE_SIZE;
      renderCards();
    }

    // ==========================================
    // カード描画
    // ==========================================
    function formatEpisodeLabel(epStr) {
      if (!epStr) return { title: '---', partBadge: '', partNum: '' };
      const parts = String(epStr).split('_');
      if (parts.length === 2) {
        const partText = parts[1] === '1' ? '1時台' : parts[1] === '2' ? '2時台' : `Part ${parts[1]}`;
        return {
          title: `#${parts[0]}`,
          partBadge: partText,
          partNum: parts[1]
        };
      }
      return { title: `#${epStr}`, partBadge: '', partNum: '' };
    }

    function renderMemberAndGuestBadgesHTML(parsed) {
      if (parsed.isEmpty) {
        return `<span class="text-xs text-slate-400 dark:text-slate-500 italic">出演メンバー情報準備中</span>`;
      }

      let html = '<div class="flex flex-wrap gap-1.5">';
      parsed.matchedMembers.forEach(m => {
        const isHighlighted = selectedMemberIds.has(m.id);
        html += `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold border ${m.badgeLight} ${m.badgeDark} ${isHighlighted ? 'ring-2 ring-indigo-500' : ''}">
            <span class="w-2 h-2 rounded-full border border-black/20 shrink-0" style="background-color: ${m.dotColor};"></span>
            <span>${m.name}</span>
          </span>
        `;
      });

      parsed.extraGuests.forEach(gName => {
        const label = (gName === 'ゲスト') ? 'ゲスト回' : `ゲスト：${gName}`;
        html += `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold border bg-fuchsia-500/15 text-fuchsia-700 dark:text-fuchsia-300 border-fuchsia-500/35">
            <i class="fa-solid fa-star text-[10px]"></i>
            <span>${escapeHtml(label)}</span>
          </span>
        `;
      });

      html += '</div>';
      return html;
    }

    function renderCards() {
      const cardGrid = document.getElementById('card-grid');
      const emptyState = document.getElementById('empty-state');
      const loadMoreWrapper = document.getElementById('load-more-wrapper');
      const loadMoreLabel = document.getElementById('load-more-label');

      if (filteredEpisodes.length === 0) {
        cardGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        loadMoreWrapper.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      const slice = filteredEpisodes.slice(0, visibleLimit);
      const remaining = filteredEpisodes.length - slice.length;

      if (remaining > 0) {
        loadMoreWrapper.classList.remove('hidden');
        loadMoreLabel.textContent = `さらに表示する（残り ${remaining}件）`;
      } else {
        loadMoreWrapper.classList.add('hidden');
      }

      cardGrid.innerHTML = slice.map(item => {
        const epInfo = formatEpisodeLabel(item.episode);
        const hasUrl = item.url && item.url.trim().startsWith('http');
        const cardBorder = item.isFav
          ? 'border-amber-400/70 dark:border-amber-400/50 ring-1 ring-amber-400/20'
          : 'border-slate-200/80 dark:border-slate-800 hover:border-indigo-400/60 dark:hover:border-indigo-500/50';

        return `
          <article class="flex flex-col justify-between p-4 rounded-2xl bg-white dark:bg-midnight-900 border ${cardBorder} shadow-sm hover:shadow-md transition-all">
            <div class="space-y-3">
              <!-- 上部：放送回・日付・お気に入り -->
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex items-center flex-wrap gap-1.5">
                    <span class="text-lg font-black tracking-tight text-slate-900 dark:text-white">${escapeHtml(epInfo.title)}</span>
                    ${epInfo.partBadge ? `
                      <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${epInfo.partNum === '2' ? 'bg-indigo-500/15 text-indigo-600 dark:text-indigo-300' : 'bg-violet-500/15 text-violet-600 dark:text-violet-300'}">
                        ${escapeHtml(epInfo.partBadge)}
                      </span>
                    ` : ''}
                    ${item.type ? `
                      <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 dark:bg-midnight-800 text-slate-600 dark:text-slate-300">
                        ${escapeHtml(item.type)}
                      </span>
                    ` : ''}
                  </div>
                  <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 flex items-center gap-1.5">
                    <i class="fa-regular fa-calendar"></i>
                    <span>${escapeHtml(item.date || '日付未設定')}</span>
                    ${item.episode ? `
                      <span class="text-slate-300 dark:text-slate-700">|</span>
                      <span class="font-mono text-[11px]">${escapeHtml(item.episode)}</span>
                    ` : ''}
                  </div>
                </div>

                <!-- お気に入りボタン -->
                <button onclick="toggleFavorite('${escapeHtml(item.epKey)}', event)" title="${item.isFav ? 'お気に入り解除' : 'お気に入りに登録'}" class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 transition active:scale-90 cursor-pointer ${item.isFav ? 'bg-amber-400/15 text-amber-400' : 'text-slate-400 hover:text-amber-400 hover:bg-amber-400/10'}">
                  <i class="${item.isFav ? 'fa-solid' : 'fa-regular'} fa-star text-base"></i>
                </button>
              </div>

              <!-- 出演メンバー＆ゲスト -->
              <div>
                ${renderMemberAndGuestBadgesHTML(item.parsed)}
              </div>

              <!-- コーナー・テーマ・INI TUNES・メモ -->
              ${(item.corner || item.theme || item.tunes || item.memo) ? `
                <div class="pt-2.5 border-t border-slate-100 dark:border-slate-800/80 space-y-1.5 text-xs">
                  ${item.corner ? `
                    <div class="flex items-start gap-1.5">
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md font-bold bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 shrink-0">
                        <i class="fa-solid fa-bookmark text-[10px]"></i>コーナー
                      </span>
                      <span class="font-semibold text-slate-700 dark:text-slate-200 pt-0.5">${escapeHtml(item.corner)}</span>
                    </div>
                  ` : ''}
                  ${item.theme ? `
                    <div class="flex items-start gap-1.5">
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md font-bold bg-sky-500/10 text-sky-600 dark:text-sky-300 shrink-0">
                        <i class="fa-regular fa-envelope text-[10px]"></i>テーマ
                      </span>
                      <span class="text-slate-600 dark:text-slate-300 pt-0.5">${escapeHtml(item.theme)}</span>
                    </div>
                  ` : ''}
                  ${item.tunes ? `
                    <div class="flex items-start gap-1.5">
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-300 shrink-0">
                        <i class="fa-solid fa-music text-[10px]"></i>INI TUNES
                      </span>
                      <span class="text-slate-600 dark:text-slate-300 pt-0.5">${escapeHtml(item.tunes)}</span>
                    </div>
                  ` : ''}
                  ${item.memo ? `
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-midnight-950/70 px-2.5 py-1.5 rounded-lg leading-relaxed whitespace-pre-line">
                      ${escapeHtml(item.memo)}
                    </p>
                  ` : ''}
                </div>
              ` : ''}
            </div>

            <!-- 下部：アーカイブ再生リンク -->
            ${hasUrl ? `
              <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800/80">
                <a href="${escapeHtml(item.url.trim())}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-sm transition active:scale-98">
                  <i class="fa-solid fa-play text-[11px]"></i>
                  <span>アーカイブを聴く</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
                </a>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');
    }

    // ==========================================
    // ユーティリティ
    // ==========================================
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass = type === 'error'
        ? 'bg-rose-600 text-white'
        : type === 'success'
        ? 'bg-emerald-600 text-white'
        : 'bg-slate-800 text-white';

      toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-2xl text-xs font-bold shadow-xl transition-all duration-300 ${bgClass}`;
      toast.innerHTML = `
        <i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }
  </script>
</body>
</html>
